schema_version: "1.0"
study_id: skin_tone_steering_pilot
status: pilot
attribute: visual_skin_tone
model:
  id: stabilityai/stable-diffusion-xl-base-1.0
  scheduler: dpm_solver_multistep_karras
  inference_steps: 25
  guidance_scale: 7.5
direction:
  estimator: paired_mean_difference
  deterministic_vae_encoding: true
  spatial_mask:
    type: gaussian_center
    radius: 1.0
    center_weight: 1.0
    edge_weight: 0.3
  optimization: false
evaluation:
  seeds: [999]
  alphas: [-1.5, -0.75, 0.0, 0.75, 1.5]
  required_metrics: [face_similarity, lpips, background_ssim]
  note: "Demonstration only; not powered for inferential claims."
