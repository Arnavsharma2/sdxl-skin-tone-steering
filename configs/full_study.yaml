schema_version: "1.0"
study_id: skin_tone_steering_confirmatory_v1
status: planned
attribute: visual_skin_tone
model:
  id: stabilityai/stable-diffusion-xl-base-1.0
  scheduler: dpm_solver_multistep_karras
  inference_steps: 25
  guidance_scale: 7.5
thresholds:
  face_similarity: 0.85
  landmark_rmse: 5.0
  lpips: 0.3
  background_ssim: 0.75
  pose_angle_diff: 5.0
  min_abs_skin_tone_change: 2.0
direction:
  estimator: paired_mean_difference
  train_pairs: 64
  held_out_pairs: 32
  training_seed_bases: [42, 137, 256, 512, 777, 1536, 2048, 3141]
  held_out_seed_bases: [5001, 5002, 5003, 5004, 5005, 5006, 5007, 5008]
  seed_extension_stride: 10000
  deterministic_vae_encoding: true
  optimization: false
  spatial_mask:
    type: gaussian_center
    radius: 1.0
    center_weight: 1.0
    edge_weight: 0.3
evaluation:
  protocol_id: tmlr_evaluation_protocol_v1
  seeds: [1000, 1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008, 1009,
          1010, 1011, 1012, 1013, 1014, 1015, 1016, 1017, 1018, 1019,
          1020, 1021, 1022, 1023, 1024, 1025, 1026, 1027, 1028, 1029]
  alphas: [-1.5, -0.75, 0.0, 0.75, 1.5]
  methods: [prompt_only, posthoc_latent, stepwise_unmasked, stepwise_masked]
  required_metrics:
    [skin_tone_change, target_direction_correct, face_similarity, lpips,
     background_ssim, total_pose_diff]
  skin_tone_metric:
    id: relative_cheek_CIELAB_Lstar_v1
    face_regions: geometric_cheek_mask
    illumination_reference: neutral_portrait_border
    max_reference_lstar_shift: 8.0
    minimum_directional_change: 2.0
  bootstrap:
    resamples: 10000
    confidence_level: 0.95
    cluster_unit: seed
  multiplicity_correction: holm
  matrix:
    pairing_unit: seed
    expected_seeds: 30
    expected_methods: 4
    expected_alphas: 5
    expected_rows: 600
    expected_nonzero_alpha_rows: 480
reporting:
  primary_outcome: identity_preservation_at_matched_skin_tone_change
  uncertainty: seed_cluster_bootstrap_confidence_interval
  report_failures_and_missingness: true
  composite_score_is_primary: false
analysis:
  version: tmlr_statistical_analysis_v1
  status: frozen
  rng_seed: 20260813
  paired_test: two_sided_seed_sign_flip_randomization
  randomization_resamples: 10000
  matched_change:
    target_metric: skin_tone_change
    scale: absolute
    interpolation: linear
    tie_handling: mean_preservation_at_exact_target_change
    extrapolation: prohibited
    support: within_seed_method_pair_intersection
    minimum_abs_target_change: 2.0
    grid_points: 101
    minimum_unique_points_per_curve: 2
    require_complete_monotonic_sweep: true
  comparisons:
    - id: h2_identity_masked_vs_prompt
      hypothesis: H2
      role: primary
      method_a: stepwise_masked
      method_b: prompt_only
      metric: face_similarity
      favorable_direction: higher
    - id: h3_background_masked_vs_unmasked
      hypothesis: H3
      role: secondary
      method_a: stepwise_masked
      method_b: stepwise_unmasked
      metric: background_ssim
      favorable_direction: higher
    - id: h4_identity_masked_vs_posthoc
      hypothesis: H4
      role: secondary
      method_a: stepwise_masked
      method_b: posthoc_latent
      metric: face_similarity
      favorable_direction: higher
    - id: h4_lpips_masked_vs_posthoc
      hypothesis: H4
      role: secondary
      method_a: stepwise_masked
      method_b: posthoc_latent
      metric: lpips
      favorable_direction: lower
