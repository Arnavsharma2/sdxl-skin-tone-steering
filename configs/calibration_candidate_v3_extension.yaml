schema_version: "1.0"
study_id: skin_tone_steering_candidate_grid_calibration_v3_extension
status: calibration
attribute: visual_skin_tone
model:
  id: stabilityai/stable-diffusion-xl-base-1.0
  revision: 462165984030d82259a11f4367a4eed129e94a7b
  local_files_only: true
  dtype: float16_cuda_float32_mps_cpu
  scheduler: dpm_solver_multistep_karras
  inference_steps: 25
  guidance_scale: 7.5
  height: 1024
  width: 1024
direction:
  estimator: paired_mean_difference
  train_pairs: 4
  held_out_pairs: 2
  deterministic_vae_encoding: true
  optimization: false
  spatial_mask:
    type: gaussian_center
    radius: 1.0
    center_weight: 1.0
    edge_weight: 0.3
data:
  light_dir: data/calibration/quality_v1/light_skin
  dark_dir: data/calibration/quality_v1/dark_skin
  training_manifest: data/generated/training_manifest_calibration_quality.json
  image_size: 1024
prompts:
  base: >-
    professional headshot portrait of a person, neutral expression, clean white
    studio background, soft diffused studio lighting, sharp focus on face,
    centered composition, no glasses no jewelry no hat, facing camera directly,
    high quality photography, 85mm lens
  negative: >-
    multiple people, accessories, sunglasses, jewelry, hat, cap, hood, blurry,
    low quality, cartoon, illustration, painting, watermark, text, extreme
    lighting, heavy shadows, overexposed, underexposed, cropped face, deformed,
    ugly, disfigured
  attribute_template: >-
    professional headshot portrait of a person with {skin_tone}, neutral
    expression, clean white studio background, soft diffused studio lighting,
    sharp focus on face, centered composition, no glasses no jewelry no hat,
    facing camera directly, high quality photography, 85mm lens
  prompt_only_levels:
    "-2.5": extremely pale skin tone
    "-2.0": very pale skin tone
evaluation:
  seeds: [900004, 900005, 900006]
  method_alphas:
    prompt_only: [-2.5, -2.0, 0.0]
    posthoc_latent: [-3.0, -2.5, -2.0, -0.75, -0.5, -0.25, 0.0, 1.0, 1.25, 1.5, 2.0, 2.5, 3.0]
    stepwise_unmasked: [0.0, 0.5, 0.75, 1.0]
    stepwise_masked: [0.0]
  methods: [prompt_only, posthoc_latent, stepwise_unmasked, stepwise_masked]
  required_metrics: [skin_tone_change, face_similarity, lpips, background_ssim, pose_difference]
  metric_implementations:
    face_similarity: facenet_vggface2_cosine
    lpips: alexnet_lpips_cpu_on_mps_hosts
    background_ssim: mtcnn_expanded_face_mask_ssim
    pose_difference: mtcnn_five_point_pose_proxy_v1
  bootstrap:
    resamples: 2000
    confidence_level: 0.95
  multiplicity_correction: holm
measurement_validation:
  metric: white_reference_bilateral_cheek_median_cielab_ita_v2
  split: held_out_direction_pairs
  report_sha256: null
  perturbations:
    brightness_0.90: {rgb_gain: [0.90, 0.90, 0.90]}
    brightness_1.10: {rgb_gain: [1.10, 1.10, 1.10]}
    warm_balance: {rgb_gain: [1.05, 1.00, 0.95]}
    cool_balance: {rgb_gain: [0.95, 1.00, 1.05]}
  gates:
    min_detection_rate: 0.0
    min_pair_order_accuracy: 0.0
    min_median_pair_gap_ita: 0.0
    max_median_abs_ita_shift: 100.0
    max_p95_abs_ita_shift: 100.0
analysis:
  target_metric: white_reference_bilateral_cheek_median_cielab_ita_v2
  reference_method: stepwise_masked
  matched_change_targets: [5.0]
  match_tolerance_ita: 3.0
reporting:
  primary_outcome: calibration_grid_extension_only
  uncertainty: seed_level_bootstrap_confidence_interval
  report_failures_and_missingness: true
