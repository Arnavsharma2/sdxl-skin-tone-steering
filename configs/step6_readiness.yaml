schema_version: "1.0"
readiness_id: tmlr_collection_readiness_v1
status: frozen_before_confirmatory_collection
study_id: skin_tone_steering_confirmatory_v1
evaluation_protocol_id: tmlr_evaluation_protocol_v1
statistical_analysis_version: tmlr_statistical_analysis_v1
decision_rule: all_required_criteria_must_pass
criteria:
  external_target_metric_validity:
    required: true
    metric_id: relative_cheek_CIELAB_Lstar_v1
    evidence_status_required: approved
    held_out_from_metric_development: true
    reference_method:
      type: calibrated_colorimeter_or_spectrophotometer
      calibration_record_required: true
    domain:
      controlled_frontal_portraits: true
      neutral_studio_background: true
      minimum_independent_people: 30
      minimum_reference_lstar_span: 30.0
      lighting_and_capture_conditions_reported: true
    agreement:
      minimum_reference_change: 2.0
      maximum_median_absolute_delta_error: 1.0
      maximum_95th_percentile_absolute_delta_error: 2.0
      minimum_direction_agreement: 0.95
      confidence_intervals_required: true
      confidence_level: 0.95
    failure_reporting:
      full_denominator_required: true
      detector_and_mask_failures_are_outcomes: true
    governance:
      license_and_consent_required: true
      limitations_and_error_profile_required: true
      independent_review_required: true
  illumination_and_color_sensitivity:
    required: true
    fixtures: synthetic_uint8_rgb_only
    non_confirmatory: true
    known_color_minimum_absolute_change: 2.0
    global_exposure_maximum_absolute_residual: 1.0
    local_illumination_minimum_apparent_change: 2.0
    reference_shift_boundary: 8.0
    reference_chroma_boundary: 14.0
    required_checks:
      - known_skin_darkening
      - known_skin_lightening
      - moderate_global_exposure_first_order_correction
      - local_skin_illumination_susceptibility
      - reference_shift_boundary_inclusive
      - reference_shift_above_boundary_rejected
      - reference_chroma_boundary_inclusive
      - reference_chroma_above_boundary_rejected
      - colored_reference_rejected
      - face_detection_failure_invalid
      - invalid_masks_rejected
      - nonfinite_input_rejected
      - checksum_match_and_drift
      - runtime_drift_rejected
  supported_metric_runtime:
    required: true
    operating_system: Linux
    python: ">=3.10,<3.13"
    mediapipe: "0.10.21"
    face_landmarker_delegate: CPU
  checksum_verified_metric_artifacts:
    required: true
    source: configs/evaluation_protocol.yaml#required_artifacts
    every_required_artifact_must_verify: true
  immutable_generation_provenance:
    required: true
    model_id: stabilityai/stable-diffusion-xl-base-1.0
    revision_format: lowercase_40_hex_commit
    requested_and_resolved_revision_must_match: true
    model_license_acceptance_required: true
    direction_sha256_required: true
    direction_source_manifest_sha256_required: true
    direction_code_commit_required: true
    direction_must_match_frozen_config: true
  storage_and_privacy:
    required: true
    policy_id: tmlr_confirmatory_storage_privacy_v1
    synthetic_inputs_only: true
    real_person_inputs: prohibited
    generated_artifacts_must_be_gitignored: true
    face_embeddings_must_not_be_persisted: true
    publication_requires_separate_review: true
  explicit_collection_approval:
    required: true
    decision_required: approved
    scope: confirmatory_collection
    approval_must_bind:
      - study_config_sha256
      - evaluation_protocol_sha256
      - readiness_protocol_sha256
      - external_validation_id
      - model_revision
      - direction_sha256
    note: A structurally valid record is not cryptographic authentication of the approver.
