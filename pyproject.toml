[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skin-tone-latent-steering"
version = "0.1.0"
description = "Research code for skin-tone direction estimation and denoising-time steering in SDXL"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "accelerate>=0.20",
  "diffusers>=0.19",
  "matplotlib>=3.7",
  "numpy>=1.24",
  "opencv-python>=4.8",
  "pandas>=2.0",
  "Pillow>=9.5",
  "PyYAML>=6.0",
  "safetensors>=0.3",
  "scikit-image>=0.21",
  "scikit-learn>=1.3",
  "scipy>=1.11",
  "torch>=2.0",
  "torchvision>=0.15",
  "transformers>=4.30",
]

[project.optional-dependencies]
evaluation = [
  "facenet-pytorch>=2.5.3",
  "insightface>=0.7.3",
  "lpips>=0.1.4",
  "mediapipe>=0.10",
  "onnxruntime>=1.15",
]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
