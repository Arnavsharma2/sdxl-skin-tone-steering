[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skin-tone-latent-steering"
version = "0.1.0"
description = "Research code for skin-tone direction estimation and denoising-time steering in SDXL"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "accelerate>=0.27,<0.30",
  "diffusers>=0.27,<0.28",
  "huggingface-hub>=0.20,<0.26",
  "matplotlib>=3.7",
  "numpy>=1.24,<2",
  "opencv-python>=4.8,<5",
  "pandas>=2.0",
  "Pillow>=9.5,<10.3",
  "PyYAML>=6.0",
  "safetensors>=0.3",
  "scikit-image>=0.21",
  "scikit-learn>=1.3",
  "scipy>=1.11",
  "torch>=2.2,<2.3",
  "torchvision>=0.17,<0.18",
  "transformers>=4.38,<4.40",
]

[project.optional-dependencies]
evaluation = [
  "facenet-pytorch>=2.6,<2.7",
  "lpips>=0.1.4",
]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
